name: Fork / Release

# Re-applies the fork commits (branch audio-tv) on every new upstream release and publishes a signed APK.

on:
  push:
    branches:
      - audio-tv
    paths:
      - .fork/base-tag
      - .github/workflows/fork-release.yaml
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Upstream tag to build (empty = every new one)
        required: false

permissions:
  contents: write

jobs:
  find:
    name: Find new upstream tags
    runs-on: ubuntu-26.04
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: List tags to build
        id: tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          base=$(cat .fork/base-tag)
          if [ -n "$REQUESTED_TAG" ]; then
            candidates="$REQUESTED_TAG"
          else
            candidates=$(git ls-remote --tags --refs https://github.com/jellyfin/jellyfin-androidtv.git | sed 's|.*refs/tags/||')
          fi
          # Keep vX.Y.Z and vX.Y.Z-beta.N / -rc.N at or after the base tag (this also skips 0.19.x)
          newer=$(printf '%s\n' $candidates | python3 -c '
          import re, sys
          def key(tag):
              m = re.fullmatch(r"v(\d+)\.(\d+)\.(\d+)(?:-(beta|rc)\.(\d+))?", tag)
              if not m: return None
              major, minor, patch, kind, n = m.groups()
              pre = (0, {"beta": 0, "rc": 1}[kind], int(n)) if kind else (1, 0, 0)
              return (int(major), int(minor), int(patch)) + pre
          base = key(sys.argv[1])
          tags = [t for t in sys.stdin.read().split() if key(t) and key(t) >= base]
          print("\n".join(sorted(tags, key=key)))
          ' "$base")
          todo=()
          for tag in $newer; do
            gh release view "fork-$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || todo+=("$tag")
          done
          echo "Tags to build: ${todo[*]:-none}"
          echo "tags=$(printf '%s\n' "${todo[@]}" | jq -R . | jq -sc 'map(select(length > 0))')" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.tag }}
    needs: find
    if: ${{ needs.find.outputs.tags != '[]' }}
    runs-on: ubuntu-26.04
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        tag: ${{ fromJSON(needs.find.outputs.tags) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audio-tv
          fetch-depth: 0
      - name: Re-apply the fork on ${{ matrix.tag }}
        env:
          TAG: ${{ matrix.tag }}
        run: |
          base=$(cat .fork/base-tag)
          git remote add upstream https://github.com/jellyfin/jellyfin-androidtv.git
          git fetch --no-tags upstream "refs/tags/$TAG:refs/tags/$TAG" "refs/tags/$base:refs/tags/$base"
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          # A conflict stops here: nothing gets published
          git rebase --onto "$TAG" "$base"
          git push --force origin "HEAD:refs/heads/build/$TAG"
      - name: Setup Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .tools-versions
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE }}" | base64 --decode > "$RUNNER_TEMP/keystore.jks"
      - name: Assemble signed release APK
        env:
          JELLYFIN_VERSION: ${{ matrix.tag }}
          KEYSTORE_FILE: ${{ runner.temp }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ matrix.tag }}
        run: |
          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac
          gh release create "fork-$TAG" app/build/outputs/apk/release/*-release.apk \
            --target "build/$TAG" \
            --title "Jellyfin Audio TV ${TAG#v}" \
            --notes "Jellyfin Android TV $TAG with the \"Audio: TV / Automatic\" button on the movie and episode screen. See FORK.md." \
            $prerelease
